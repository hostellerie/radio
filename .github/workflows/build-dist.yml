name: Build distributable archive

on:
  push:
    branches:
      - develop-1.0
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write


jobs:
  compatibility-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '5.6'
          - '8.1'
          - '8.3'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, simplexml
          coverage: none

      - name: Show PHP runtime
        run: php -v

      - name: Validate plugin PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './dist/*' -not -path './build/*' -print0 | xargs -0 -n1 php -l

      - name: Plugin API contract check
        run: php tests/plugin_api_contract.php

      - name: Bootstrap runtime contract check
        run: php tests/bootstrap_runtime.php

  build-dist:
    needs: compatibility-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read plugin metadata
        id: metadata
        shell: bash
        run: |
          VERSION="$(php -r 'echo preg_match("/RADIO_PLUGIN_VERSION.+?([0-9]+\\.[0-9]+\\.[0-9]+)/", file_get_contents("version.php"), $m) ? $m[1] : "";')"
          GL_VERSION="$(php -r 'echo preg_match("/RADIO_MIN_GEEKLOG_VERSION.+?([0-9]+\\.[0-9]+\\.[0-9]+)/", file_get_contents("version.php"), $m) ? $m[1] : "";')"

          test -n "$VERSION" || { echo "Unable to read Radio version" >&2; exit 1; }
          test -n "$GL_VERSION" || { echo "Unable to read Geeklog version" >&2; exit 1; }

          ARCHIVE="radio_${VERSION}_${GL_VERSION}.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "gl_version=$GL_VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Validate plugin manifest
        run: |
          php -r '
          $m = json_decode(file_get_contents("plugin.json"), true);
          if (!is_array($m)
              || (int) ($m["schema"] ?? 0) !== 1
              || ($m["id"] ?? "") !== "radio"
              || ($m["requires"]["geeklog"] ?? "") !== "2.1.1"
              || ($m["requires"]["php"] ?? "") !== "5.6.0") {
              fwrite(STDERR, "Invalid plugin.json\n");
              exit(1);
          }'

      - name: Validate PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './dist/*' -not -path './build/*' -print0 | xargs -0 -n1 php -l

      - name: Validate Radio admin UI architecture
        shell: bash
        run: |
          ! grep -Rni "configuration.php?conf_group=radio" admin --include='*.php'
          ! grep -Rni "COM_startBlock(" admin --include='*.php'
          test -f admin/admin-ui.inc.php
          test -f admin/radio-admin.css
          test -f admin/radio-admin.js
          test -f public_html/radio.css
          test -f public_html/radio.js
          test -f public_html/radio-block.css
          test -f templates/admin/page.thtml
          test -f templates/admin/navigation.thtml
          test -f templates/admin/configuration-button.thtml
          test -f templates/admin/quick-actions.thtml
          test -f templates/admin/media-upload.thtml
          test -f templates/admin/media-external.thtml
          test -f admin/upload.php
          test -f admin/external.php
          test -f admin/edit.php
          test -f install_updates.php
          grep -q "on_demand" sql/mysql_install.php
          grep -q "broadcast" sql/mysql_install.php
          grep -q "plugin_upgrade_radio" functions.inc
          ! grep -q "name=\"save_media\"" admin/index.php
          ! grep -q "<audio" admin/index.php

      - name: Validate versioned Radio assets
        shell: bash
        run: |
          grep -q "RADIO_publicStylesheetLink" functions.inc
          grep -q "RADIO_publicScriptTag" functions.inc
          grep -q "RADIO_adminScriptTag" functions.inc
          grep -q "RADIO_assetVersion" functions.inc
          ! grep -Rni "<script>(function" public_html --include='*.php'
          ! grep -Rni "footercode.*RADIO_" public_html --include='*.php'

      - name: Validate security invariants
        shell: bash
        run: |
          grep -q "function plugin_wsEnabled_radio" functions.inc
          grep -q "function service_dashboard_summary_radio" services.inc.php
          grep -q "CURLOPT_RESOLVE" lib/feed.inc.php
          grep -q "SEC_checkToken()" admin/sources.php
          ! grep -RniE "DB_(query|getItem).*gl_" --include='*.php' . --exclude-dir=dist --exclude-dir=build

      - name: Build installable ZIP
        run: |
          ARCHIVE="${{ steps.metadata.outputs.archive }}"
          rm -rf build
          mkdir -p build/radio dist

          rsync -a ./ build/radio/             --exclude='.git/'             --exclude='.github/'             --exclude='dist/'             --exclude='build/'             --exclude='.*'

          rm -f "dist/$ARCHIVE"
          (cd build && zip -r -q "../dist/$ARCHIVE" radio)

          unzip -l "dist/$ARCHIVE"

      - name: Reject hidden archive entries
        run: |
          ARCHIVE="dist/${{ steps.metadata.outputs.archive }}"
          unzip -Z1 "$ARCHIVE" | awk -F/ '
          {
            for (i = 1; i <= NF; i++) {
              if ($i ~ /^\./) {
                print "Hidden archive entry: " $0 > "/dev/stderr";
                found = 1;
              }
            }
          }
          END { exit found ? 1 : 0 }'

      - name: Validate installable structure
        run: |
          ARCHIVE="dist/${{ steps.metadata.outputs.archive }}"
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/autoinstall.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/functions.inc'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/services.inc.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/docs/SERVICES.md'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/tests/plugin_api_contract.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/tests/bootstrap_runtime.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/admin-ui.inc.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/radio-admin.css'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/templates/admin/page.thtml'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/templates/admin/navigation.thtml'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/templates/admin/configuration-button.thtml'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/templates/admin/quick-actions.thtml'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/templates/admin/media-upload.thtml'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/templates/admin/media-external.thtml'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/install_defaults.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/install_updates.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/plugin.json'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/language/english.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/index.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/upload.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/external.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/edit.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/templates/admin/media-list.thtml'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/templates/admin/media-list-table.thtml'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/templates/admin/media-list-row.thtml'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/templates/admin/media-edit.thtml'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/programs.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/schedule.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/rotation.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/stats.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/sources.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/index.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/radio.css'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/radio.js'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/radio-block.css'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/admin/radio-admin.js'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/media.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/program.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/schedule.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/now.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/replay.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/podcast.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/cover.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/public_html/event.php'
          unzip -Z1 "$ARCHIVE" | grep -qx 'radio/sql/mysql_install.php'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-${{ steps.metadata.outputs.version }}-geeklog-${{ steps.metadata.outputs.gl_version }}
          path: dist/${{ steps.metadata.outputs.archive }}
          if-no-files-found: error

      - name: Commit updated archive
        run: |
          ARCHIVE="${{ steps.metadata.outputs.archive }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${GITHUB_REF_NAME}"
          LATEST_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"

          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "A newer branch commit exists; skip publishing this stale archive."
            exit 0
          fi

          find dist -maxdepth 1 -type f -name 'radio_*.zip' ! -name "$ARCHIVE" -delete
          git add -A dist

          if git diff --cached --quiet; then
            echo "Archive unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "Build Radio ${{ steps.metadata.outputs.version }} distributable [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
