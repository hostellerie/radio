name: Temporary Radio language build

on:
  push:
    branches:
      - develop-1.0
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop-1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate translations
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import json
          import os
          import re
          import shutil
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          src_path = Path("language/english.php")
          src = src_path.read_text(encoding="utf-8")

          targets = [
              ("spanish_utf-8.php", "Spanish (international/neutral)"),
              ("italian_utf-8.php", "Italian"),
              ("japanese_utf-8.php", "Japanese"),
              ("russian_utf-8.php", "Russian"),
              ("chinese_simplified_utf-8.php", "Simplified Chinese (zh-CN)"),
              ("chinese_traditional_utf-8.php", "Traditional Chinese (zh-TW)"),
              ("hebrew_utf-8.php", "Hebrew"),
              ("persian_utf-8.php", "Persian (Farsi)"),
              ("french_canada_utf-8.php", "Canadian French (fr-CA)"),
              ("german_utf-8.php", "German, neutral informal UI style"),
              ("german_formal_utf-8.php", "German formal UI style, consistently use Sie/Ihnen where addressing the user"),
              ("spanish_argentina_utf-8.php", "Argentinian Spanish (es-AR), natural local vocabulary; use voseo only where direct address makes it natural"),
          ]

          ph_re = re.compile(r'%(?:\d+\$)?[bcdeEfFgGosuxX]')
          pair_re = re.compile(r"'((?:\\'|[^'])*)'\s*=>\s*'((?:\\'|[^'])*)'")

          # Collect all user-visible English strings. In configuration selects,
          # the left side is the visible label and the right side is the internal value.
          visible = []
          in_selects = False
          for line in src.splitlines():
              if line.startswith("$LANG_configselects['radio']"):
                  in_selects = True
              for m in pair_re.finditer(line):
                  visible.append(m.group(1) if in_selects else m.group(2))

          unique = []
          seen = set()
          for value in visible:
              if value not in seen:
                  seen.add(value)
                  unique.append(value)

          ids = {f"s{i}": value for i, value in enumerate(unique)}
          id_for_value = {value: key for key, value in ids.items()}

          def call_model(locale, source_map, repair=False):
              if repair:
                  instruction = (
                      "Repair only these translations. Return a JSON object using exactly the same IDs. "
                      "Translate naturally into " + locale + ". Preserve every printf placeholder exactly "
                      "as present in the English source, including type and order. Do not add commentary."
                  )
              else:
                  instruction = (
                      "Translate the following Geeklog Radio plugin UI strings from English into " + locale + ". "
                      "Return ONLY a JSON object whose keys are exactly the supplied IDs and whose values are the "
                      "translated strings. Preserve printf placeholders exactly (%s, %d, positional placeholders, "
                      "etc.), with the same type and order. Preserve technical tokens and brand/protocol names where "
                      "appropriate: Radio, HTTP, HTTPS, RSS, Atom, MP3, PHP, Nginx, Apache, LiteSpeed, X-Sendfile, "
                      "X-Accel-Redirect, M3U, DJ FX. Keep UI text concise, natural and professional. Do not translate "
                      "internal identifiers or invent information. Do not omit any ID. Do not add explanations."
                  )

              payload = {
                  "model": "openai/gpt-4o-mini",
                  "temperature": 0.1,
                  "max_tokens": 6000,
                  "response_format": {"type": "json_object"},
                  "messages": [
                      {"role": "system", "content": instruction},
                      {"role": "user", "content": json.dumps(source_map, ensure_ascii=False)}
                  ]
              }
              data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(
                  "https://models.github.ai/inference/chat/completions",
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  },
                  method="POST",
              )
              last = None
              for attempt in range(8):
                  try:
                      with urllib.request.urlopen(req, timeout=90) as response:
                          body = json.loads(response.read().decode("utf-8"))
                      content = body["choices"][0]["message"]["content"]
                      result = json.loads(content)
                      if not isinstance(result, dict):
                          raise RuntimeError("model response is not a JSON object")
                      return result
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, KeyError, json.JSONDecodeError, RuntimeError) as exc:
                      last = exc
                      if isinstance(exc, urllib.error.HTTPError) and exc.code not in (408, 429, 500, 502, 503, 504):
                          raise
                      if attempt == 7:
                          raise RuntimeError(f"GitHub Models request failed for {locale}: {last}")
                      time.sleep(10 + attempt * 10)

          def translate_locale(locale):
              ordered_ids = list(ids.keys())
              result = {}

              # Keep each model response small and deterministic.
              for offset in range(0, len(ordered_ids), 80):
                  chunk_ids = ordered_ids[offset:offset + 80]
                  chunk = {key: ids[key] for key in chunk_ids}
                  translated = call_model(locale, chunk)

                  missing = [key for key in chunk_ids if key not in translated]
                  extra = [key for key in translated if key not in chunk]
                  if missing or extra:
                      raise RuntimeError(f"{locale}: missing IDs={missing}, extra IDs={extra}")

                  bad = {}
                  for key in chunk_ids:
                      english = ids[key]
                      value = translated[key]
                      if not isinstance(value, str) or not value.strip():
                          bad[key] = english
                          continue
                      if ph_re.findall(english) != ph_re.findall(value):
                          bad[key] = english

                  if bad:
                      repair_input = {
                          key: {"english": ids[key], "current_translation": translated.get(key, "")}
                          for key in bad
                      }
                      repaired = call_model(locale, repair_input, repair=True)
                      for key in bad:
                          if key not in repaired or not isinstance(repaired[key], str):
                              raise RuntimeError(f"{locale}: repair omitted {key}")
                          translated[key] = repaired[key]

                  for key in chunk_ids:
                      english = ids[key]
                      if ph_re.findall(english) != ph_re.findall(translated[key]):
                          raise RuntimeError(
                              f"{locale}: placeholder mismatch {key}: "
                              f"{ph_re.findall(english)} != {ph_re.findall(translated[key])}"
                          )
                      result[key] = translated[key]

                  print(f"  {locale}: {min(offset + 80, len(ordered_ids))}/{len(ordered_ids)} strings", flush=True)
                  time.sleep(2)

              return {english: result[key] for key, english in ids.items()}

          def escape_php(value):
              return value.replace("\\", "\\\\").replace("'", "\\'")

          def render(mapping):
              lines = []
              in_selects = False
              for line in src.splitlines():
                  if line.startswith("$LANG_configselects['radio']"):
                      in_selects = True
                  if in_selects:
                      def repl_left(m):
                          left, right = m.group(1), m.group(2)
                          return "'" + escape_php(mapping.get(left, left)) + "' => '" + right + "'"
                      line = pair_re.sub(repl_left, line)
                  else:
                      def repl_val(m):
                          left, right = m.group(1), m.group(2)
                          return "'" + left + "' => '" + escape_php(mapping.get(right, right)) + "'"
                      line = pair_re.sub(repl_val, line)
                  lines.append(line)
              return "\n".join(lines) + "\n"

          def extract_main(text):
              m = re.search(r"\$LANG_RADIO\s*=\s*array\((.*?)\n\);", text, re.S)
              if not m:
                  raise RuntimeError("LANG_RADIO missing")
              return dict(pair_re.findall(m.group(1)))

          en_main = extract_main(src)

          def validate_file(path):
              text = Path(path).read_text(encoding="utf-8")
              # UTF-8 round trip
              text.encode("utf-8").decode("utf-8")
              subprocess.run(["php", "-l", str(path)], check=True)
              cur = extract_main(text)
              missing = [k for k in en_main if k not in cur]
              extra = [k for k in cur if k not in en_main]
              if missing or extra:
                  raise RuntimeError(f"{path}: missing={missing} extra={extra}")
              for key, value in en_main.items():
                  if ph_re.findall(value) != ph_re.findall(cur[key]):
                      raise RuntimeError(
                          f"{path}: placeholder mismatch {key}: "
                          f"{ph_re.findall(value)} != {ph_re.findall(cur[key])}"
                      )

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)

          # French France is already a complete curated translation in french.php.
          fr = Path("language/french.php").read_text(encoding="utf-8")
          Path("language/french_france.php").write_text(fr, encoding="utf-8")
          validate_file("language/french_france.php")

          for filename, locale in targets:
              print(f"Translating {filename} -> {locale}", flush=True)
              mapping = translate_locale(locale)
              path = Path("language", filename)
              path.write_text(render(mapping), encoding="utf-8")
              validate_file(path)

              subprocess.run(["git", "add", str(path)], check=True)
              staged = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if staged.returncode != 0:
                  subprocess.run(["git", "commit", "-m", f"Add Radio {filename} translation"], check=True)
                  subprocess.run(["git", "push", "origin", "HEAD:develop-1.0"], check=True)

          # Final syntax pass over every language file.
          for path in sorted(Path("language").glob("*.php")):
              subprocess.run(["php", "-l", str(path)], check=True)

          print("All requested Radio language files generated and mechanically validated.", flush=True)
      - name: Verify working tree
        run: git status --short
